<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Item Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div class="brand-mark">IM</div>
      <div>
        <p class="eyebrow">INVENTORY / WORKSPACE</p>
        <h1>Item Manager</h1>
        <p class="subtitle">A simple, considered space to manage your items.</p>
      </div>
    </header>

    <div class="content-grid">
      <section class="panel">
        <div class="panel-heading">
          <div><p class="eyebrow">ITEM DETAILS</p><h2 id="form-title">Add an item</h2></div>
          <span class="step-number">01</span>
        </div>
        <form id="item-form">
          <input type="hidden" id="item-id">
          <label for="name">Item name</label>
          <input id="name" name="name" type="text" placeholder="e.g. Notebook" required maxlength="100" autocomplete="off">
          <label for="price">Price <span class="hint">(INR ₹)</span></label>
          <div class="price-input"><span>₹</span><input id="price" name="price" type="number" placeholder="0.00" min="0" step="0.01" required></div>
          <div class="form-actions">
            <button id="submit-button" class="primary" type="submit">Add item <span>↗</span></button>
            <button id="cancel-button" class="secondary hidden" type="button">Cancel</button>
          </div>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
      </section>

      <section class="panel list-panel">
        <div class="panel-heading">
          <div><p class="eyebrow">YOUR COLLECTION</p><h2>Items <span id="item-count" class="count">0</span></h2></div>
          <span class="step-number">02</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Item</th><th>Price</th><th class="right">Actions</th></tr></thead>
            <tbody id="items-body"><tr><td colspan="4" class="empty">Loading items…</td></tr></tbody>
          </table>
        </div>
        <div class="list-footer"><span class="dot"></span><span id="list-status">Ready to manage your items</span></div>
      </section>
    </div>
    <footer><span>ITEM MANAGER</span><span>Minimal by design · Powered by Express.js</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
