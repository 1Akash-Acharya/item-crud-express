<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item CRUD App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Item Management</h1>
    <p class="subtitle">Create, view, update and delete items</p>

    <section class="form-card">
      <h2 id="form-title">Add Item</h2>
      <form id="item-form">
        <input type="hidden" id="item-id">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="e.g. Book" required maxlength="100">

        <label for="price">Price (₹)</label>
        <input id="price" name="price" type="number" placeholder="e.g. 250" min="0" step="0.01" required>

        <div class="form-actions">
          <button id="submit-button" type="submit">Submit</button>
          <button id="cancel-button" type="button" class="secondary hidden">Cancel Edit</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="table-card">
      <h2>Items List</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Price (₹)</th><th>Action</th></tr>
          </thead>
          <tbody id="items-body">
            <tr><td colspan="4">Loading items...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
